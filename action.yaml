name: 'Package PowerShell Script as EXE'
description: 'Package a PowerShell script into <name>-<version>.exe for an exact release tag'

inputs:
  script-path:
    description: 'Path to the PowerShell script to package, relative to the workspace'
    required: true
  name:
    description: 'Executable name; the file becomes <name>-<version>.exe'
    required: true
  tag:
    description: 'Exact stable release tag, such as v1.2.3; prerelease tags are refused'
    required: true

outputs:
  file:
    description: 'Path of the built executable'
    value: ${{ steps.build.outputs.file }}

runs:
  using: composite
  steps:
    - name: Set up PowerShell
      uses: vhco-pro/setup-pwsh-action@a90bb078c3d694146ebc7c255404ac5057c85e2d # v0.1.0
    - name: Package the script
      id: build
      shell: pwsh
      env:
        BUILD_SCRIPT_PATH: ${{ inputs.script-path }}
        BUILD_NAME: ${{ inputs.name }}
        BUILD_TAG: ${{ inputs.tag }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH ''scripts'' ''build.ps1'')'

branding:
  icon: package
  color: blue
